<div class="card">
    <h2>Movies</h2>
    <button mat-raised-button color="primary" (click)="onAddRandomMovie()" style="margin-bottom: 16px;">
        Add Random Movie
    </button>

    @if (paginatedMovies$ | async; as movies) {
        @if (movies.length > 0) {
            <div class="table-container">
                <table mat-table [dataSource]="movies" class="mat-elevation-z8">
                    <!-- Title Column -->
                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef>Title</th>
                        <td mat-cell *matCellDef="let movie">{{ movie.title }}</td>
                    </ng-container>
                    <!-- IMDB ID Column -->
                    <ng-container matColumnDef="imdbId">
                        <th mat-header-cell *matHeaderCellDef>IMDB ID</th>
                        <td mat-cell *matCellDef="let movie">{{ movie.imdbId }}</td>
                    </ng-container>
                    <!-- Year Column -->
                    <ng-container matColumnDef="year">
                        <th mat-header-cell *matHeaderCellDef>Year</th>
                        <td mat-cell *matCellDef="let movie">{{ movie.year }}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td mat-cell *matCellDef="let movie">
                            <button mat-stroked-button color="primary" type="button" (click)="onEditMovie(movie)">
                                Edit
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
                </table>
                <mat-paginator
                    [length]="(totalMovies$ | async) ?? 0"
                    [pageSize]="(pageSize$ | async) ?? 10"
                    [pageIndex]="(pageIndex$ | async) ?? 0"
                    [pageSizeOptions]="[5, 10, 20, 50]"
                    [showFirstLastButtons]="true"
                    (page)="onPageChange($event)"
                >
                </mat-paginator>
            </div>
        }
        @if (movies.length === 0) {
            <div class="empty-state">
                <p>No movies found.</p>
            </div>
        }
    }
</div>
