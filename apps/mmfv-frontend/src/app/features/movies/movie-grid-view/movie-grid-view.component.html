<div class="movie-grid">
    @for (movie of movies; track movie.id) {
        <article class="movie-grid-item">
            <div class="poster-placeholder" aria-hidden="true"></div>
            <div class="movie-grid-content">
                <strong class="movie-title">{{ displayTitle(movie) }}</strong>
                <span class="movie-meta">TMDB ID: {{ movie.tmdbId ?? '—' }}</span>
                <span class="movie-meta">Year: {{ movie.year ?? '—' }}</span>
                <div class="actions">
                    <button
                        mat-icon-button
                        color="primary"
                        type="button"
                        matTooltip="Edit"
                        aria-label="Edit movie"
                        (click)="onEditMovie(movie)"
                    >
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        color="warn"
                        type="button"
                        matTooltip="Delete"
                        aria-label="Delete movie"
                        (click)="onDeleteMovie(movie)"
                    >
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>
        </article>
    }
</div>
