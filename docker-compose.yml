services:
    mongodb:
        image: mongo:7
        container_name: mmfv-mongodb
        ports:
            - '27017:27017'
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=password
            - MONGO_INITDB_DATABASE=mmfv
        volumes:
            - mongodb_data:/data/db
        restart: unless-stopped
        networks:
            - mmfv-network

    backend:
        build:
            context: .
            dockerfile: apps/mmfv-backend/Dockerfile
        container_name: mmfv-backend
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=development
            - PORT=3000
            - MONGODB_URI=mongodb://admin:password@mongodb:27017/mmfv?authSource=admin
        depends_on:
            - mongodb
        restart: unless-stopped
        networks:
            - mmfv-network

volumes:
    mongodb_data:

networks:
    mmfv-network:
        driver: bridge
